name: Analytics CI
on:
  push:
    branches: [main, improve-operations-evidence]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: analytics-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run reproducible checks
        run: bash scripts/ci.sh
      - name: Save validated outputs
        uses: actions/upload-artifact@v4
        with:
          name: analytics-validation
          retention-days: 7
          if-no-files-found: error
          path: |
            results/heldout_tatqa_ci.json
